<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NV2 Production Viewer</title>

    <link rel="stylesheet" href="style.css">

    <script src="papaparse.min.js"></script>
</head>

<body>

<h1>NV2 Production Viewer</h1>
    
<div style="margin-bottom:15px;">

<button onclick="setTab('ALL')">
ALL
</button>

<button onclick="setTab('ASSY')">
ASSY#SHIP
</button>

<button onclick="setTab('BUMP')">
BUMP#SHIP
</button>

</div>
    <div class="toolbar">

        <input type="file"
               id="csvFile"
               multiple
               accept=".csv">

        <button onclick="loadFiles()">
            CSV Upload
        </button>

        <button onclick="clearAllData()">
            Clear Data
        </button>

    </div>

    <hr>

    <div class="search-area">

        <input id="targetDevice"
placeholder="Target Device"
list="targetList">
        <input id="po"
               placeholder="Production Order">

        <input id="batch"
               placeholder="New Build-As Batch">

        <input id="bridge"
               placeholder="Bridge Batch">

        <input type="date"
               id="fromDate">

        <input type="date"
               id="toDate">

        <button onclick="searchData()">
            Search
        </button>

        <button onclick="resetSearch()">
            Reset
        </button>

    </div>

    <div id="resultCount"></div>

<table id="resultTable">

<thead>

<tr>

<th>Release Date</th>
<th>Production Order Number</th>
<th>Revision Status</th>
<th>Routing</th>
<th>Target Device</th>
<th>New Build-As Batch</th>
<th>Ship To</th>
<th>Qty</th>

    
</tr>

</thead>

<tbody></tbody>

</table>

    <script src="app.js"></script>

<div id="historyModal"
style="
display:none;
position:fixed;
top:5%;
left:5%;
width:90%;
height:85%;
background:white;
overflow:auto;
padding:20px;
z-index:9999;
border:2px solid #000;
">

<button onclick="
document.getElementById('historyModal').style.display='none'
">
닫기
</button>

<hr>

<div id="historyContent"></div>

</div>

    
</body>

</html>
